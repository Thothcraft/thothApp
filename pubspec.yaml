name: thothcraft
description: Revolutionary AI/IoT platform mobile app - Federated Learning, Differential Privacy, and Smart Sensors.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # HTTP & Networking
  dio: ^5.7.0

  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Storage
  shared_preferences: ^2.3.3

  # Local notifications (Brain event feed -> push)
  flutter_local_notifications: ^17.2.4

  # BLE (PineTime / InfiniTime gateway + node commissioning)
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.3.1
  # BLE identity beacon — lets CSI receivers/Pis see this phone as an
  # owner-tagged advertiser for RSSI anchoring
  flutter_ble_peripheral: 1.2.6

  # Setup QR scanning + phone motion source
  mobile_scanner: ^6.0.2
  sensors_plus: ^6.1.0
  crypto: ^3.0.5

  # Foreground service — keeps the BLE relay + GPS alive with screen off
  flutter_foreground_task: ^8.1.1

  # Phone GPS trace + map rendering (OSM tiles)
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Secure storage (watch device JWTs, pairing secrets)
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1

  # OTA firmware update (Nordic Secure DFU over mcuboot)
  nordic_dfu: ^7.0.0
  file_picker: ^8.1.2

  # Utilities
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0
  intl: ^0.20.2

  # UI Enhancements
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  archive: ^4.3.0
  record: ^7.1.2
  path_provider: ^2.1.6

# flutter_plugin_android_lifecycle ≥2.0.26 ships AAR metadata compiled
# against API 36, failing file_picker's checkAarMetadata at compileSdk <36.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    # Product Images
    - assets/images/products/white_bg.jpg
    - assets/images/products/closeup.jpg
    - assets/images/products/lifestyle.jpg
    
    # Animated Icons (GIFs)
    - assets/images/icons/artificial-intelligence.gif
    - assets/images/icons/iot.gif
    - assets/images/icons/data-collection.gif
    - assets/images/icons/privacy.gif
    
    # Video Tutorials
    - assets/videos/getting_started.mp4
    - assets/videos/first.mp4
    - assets/videos/sensors.mp4

    # PineTime DFU image (thoth-fork InfiniTime — stamped motion + scan)
    - assets/firmware/pinetime-mcuboot-app-dfu-1.16.99.zip

  # Fonts (if custom fonts are needed)
  # fonts:
  #   - family: SFProDisplay
  #     fonts:
  #       - asset: assets/fonts/SFProDisplay-Regular.ttf
  #       - asset: assets/fonts/SFProDisplay-Bold.ttf
  #         weight: 700
